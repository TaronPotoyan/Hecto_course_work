<!-- src/app/header/discount.component/discount.component.html -->
<div class="hero-section">
  <div class="decorative-lamp" aria-hidden="true">
    <img src="hero-light.svg" alt="" />
  </div>
  <div class="hero-wrapper">
    <div class="hero-content">
      <span class="sub-title">{{ product().smallTitle }}</span>
      <h1 class="main-title heading-2">{{ product().title }}</h1>
      <p class="paragraph">{{ product().paragraph }}</p>
      <button class="btn-primary" (click)="handleShop()">{{ 'Shop Now' | t }}</button>
    </div>

    <div class="hero-image-container">
      <div class="image-wrapper">
        <img [src]="product().imgUrl" [alt]="product().title" />
        <div class="discount-badge">
          <span>50%</span>
          <span>{{ 'Off' | t }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
