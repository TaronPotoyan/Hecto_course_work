<!-- src/app/pages/basketPage/basketItem/basketItem.component.html -->
<div class="basket-item">
  <div class="product-info">
    <div class="product-image">
      <img [src]="itemInp().url" [alt]="itemInp().name" />
    </div>
    <div class="product-details">
      <h3 class="product-name">{{ itemInp().name }}</h3>
      <p class="product-price">${{ itemInp().currentPrice | number: numberFormat.Currency }}</p>
      <button type="button" class="remove-btn" (click)="remove()">{{ 'Remove' | t }}</button>
    </div>
  </div>
  <div class="actions">
    <div class="quantity-selector">
      <button
        type="button"
        [attr.aria-label]="'Decrease quantity' | t"
        (click)="updateCount(quantityAction.DecreaseByOne)"
      >
        −
      </button>
      <span class="count" aria-live="polite">{{ quantity() }}</span>
      <button
        type="button"
        [attr.aria-label]="'Increase quantity' | t"
        (click)="updateCount(quantityAction.IncreaseByOne)"
      >
        +
      </button>
    </div>
    <div class="total-price">
      ${{ itemInp().currentPrice * quantity() | number: numberFormat.Currency }}
    </div>
  </div>
</div>
