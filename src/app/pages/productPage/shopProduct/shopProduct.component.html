<div
  class="product-card"
  [ngClass]="{
    list: layout() === 'list',
    grid: layout() === 'grid',
  }"
>
  <div class="image-container" (click)="viewDetails()">
    <img [src]="product().url" [alt]="product().name" />
  </div>

  <div class="content-container">
    <div class="header">
      <h3 class="heading-4" (click)="viewDetails()">{{ product().name }}</h3>
      <div class="rating">
        @for (item of ratingsArr; track $index) {
          <span class="fa fa-star star" [class.checked]="item <= product().rating"> </span>
        }
      </div>
    </div>

    <div class="pricing">
      <span class="current-price">{{ product().currentPrice | currency }}</span>
      <span class="original-price">{{ product().originalPrice | currency }}</span>
    </div>

    <p class="description">
      {{ product().description }}
    </p>

    <div class="actions">
      <button
        type="button"
        [attr.aria-label]="'Add to cart' | t"
        (click)="handleAction(productActions.Basket)"
      >
        <img src="Basket-icon.svg" alt="" />
      </button>
      <button
        type="button"
        [attr.aria-label]="'Add to wishlist' | t"
        (click)="handleAction(productActions.Like)"
      >
        <img src="heart-icon.svg" alt="" />
      </button>
      <button
        type="button"
        [attr.aria-label]="'Zoom image' | t"
        (click)="handleAction(productActions.Zoom)"
      >
        <img class="zoom-icon" src="Zoom-icon.svg" alt="" />
      </button>
    </div>
  </div>
</div>

@if (isZoomed()) {
  <div class="zoom-overlay" (click)="toggleZoom(false)">
    <div class="zoom-content" (click)="$event.stopPropagation()">
      <img [src]="product().url" [alt]="product().name" />
      <button class="close-btn" (click)="toggleZoom(false)">{{ 'Close' | t }}</button>
    </div>
  </div>
}
